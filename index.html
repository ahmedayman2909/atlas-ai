<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ferrari Sample</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="info">
        Drag to rotate | Scroll to zoom
    </div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(50, 50),
            new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Materials
        const bodyMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xd00000, // Classic Ferrari Red
            metalness: 0.7,
            roughness: 0.2,
        });
        const glassMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222, 
            metalness: 0.9,
            roughness: 0.1,
            opacity: 0.7,
            transparent: true
        });
        const tireMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const lightMaterial = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffffaa });
        const tailLightMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 });

        const carGroup = new THREE.Group();

        // 1. Car Body (Main Chassis)
        const bodyGeometry = new THREE.BoxGeometry(4, 0.8, 1.8);
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = 0.8;
        body.castShadow = true;
        carGroup.add(body);

        // 2. Hood/Sloped Front
        const hoodGeometry = new THREE.BoxGeometry(1.2, 0.4, 1.7);
        const hood = new THREE.Mesh(hoodGeometry, bodyMaterial);
        hood.position.set(2.2, 0.6, 0);
        hood.rotation.z = 0.1; // Slight slope
        hood.castShadow = true;
        carGroup.add(hood);

        // 3. Cabin/Roof
        const cabinGeometry = new THREE.BoxGeometry(1.8, 0.7, 1.4);
        const cabin = new THREE.Mesh(cabinGeometry, glassMaterial);
        cabin.position.set(-0.2, 1.3, 0);
        cabin.castShadow = true;
        carGroup.add(cabin);

        // 4. Rear Spoiler (F40 style)
        const spoilerArm1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), bodyMaterial);
        spoilerArm1.position.set(-2.2, 1.1, 0.5);
        carGroup.add(spoilerArm1);
        
        const spoilerArm2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), bodyMaterial);
        spoilerArm2.position.set(-2.2, 1.1, -0.5);
        carGroup.add(spoilerArm2);

        const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 1.8), bodyMaterial);
        spoilerWing.position.set(-2.4, 1.3, 0);
        spoilerWing.castShadow = true;
        carGroup.add(spoilerWing);

        // 5. Wheels
        function createWheel(x, z) {
            const wheelGroup = new THREE.Group();
            const tireGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 32);
            const tire = new THREE.Mesh(tireGeometry, tireMaterial);
            tire.rotation.z = Math.PI / 2;
            tire.castShadow = true;
            wheelGroup.add(tire);

            // Rim
            const rimGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.41, 32);
            const rim = new THREE.Mesh(rimGeometry, new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 }));
            rim.rotation.z = Math.PI / 2;
            wheelGroup.add(rim);

            wheelGroup.position.set(x, 0.5, z);
            return wheelGroup;
        }

        carGroup.add(createWheel(1.5, 0.8));
        carGroup.add(createWheel(1.5, -0.8));
        carGroup.add(createWheel(-1.5, 0.8));
        carGroup.add(createWheel(-1.5, -0.8));

        // 6. Headlights & Taillights
        const headLightGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const hl1 = new THREE.Mesh(headLightGeo, lightMaterial);
        hl1.position.set(3.1, 0.9, 0.6);
        carGroup.add(hl1);
        
        const hl2 = new THREE.Mesh(headLightGeo, lightMaterial);
        hl2.position.set(3.1, 0.9, -0.6);
        carGroup.add(hl2);

        const tailLightGeo = new THREE.BoxGeometry(0.1, 0.15, 1.6);
        const tl = new THREE.Mesh(tailLightGeo, tailLightMaterial);
        tl.position.set(-2.01, 0.9, 0);
        carGroup.add(tl);

        // Add Car to Scene
        scene.add(carGroup);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Optional: Slowly rotate car for showcase
            // carGroup.rotation.y += 0.005;
            
            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
