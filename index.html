/* Phase 2 workflow + alarm enhancements */
.automation-workflow{display:grid;gap:10px;margin-top:6px}
.workflow-step{border:1px solid var(--line);border-radius:18px;padding:11px;background:rgba(255,255,255,.035);display:grid;gap:9px;position:relative;animation:workflowIn .2s ease-out}
@keyframes workflowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.workflow-step-head{display:flex;align-items:center;gap:8px}
.workflow-step-index{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.10);font-size:10px;font-weight:750}
.workflow-step-type{font-size:12px;font-weight:750}
.workflow-step-remove{margin-left:auto;width:30px;height:30px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:10px;cursor:pointer}
.workflow-step textarea{width:100%;min-height:78px;resize:vertical}
.workflow-step-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.workflow-enhance{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:700;cursor:pointer}
.workflow-enhance.active{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.workflow-add{display:flex;gap:7px;align-items:center}
.workflow-add button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);border-radius:14px;padding:10px 8px;cursor:pointer;font-size:11px;font-weight:700}
.workflow-add button:hover{background:rgba(255,255,255,.09)}
.workflow-model{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--text)}
.workflow-source-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.workflow-source-row input[type=file]{display:none}
.workflow-upload-btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;padding:9px 11px;font-size:10px;font-weight:700;cursor:pointer}
.workflow-source-note{font-size:9px;color:var(--muted);flex:1;min-width:120px}
.automation-focus-mode .automation-form>*:not(.automation-task-name):not(#automationWorkflow){display:none!important}.automation-focus-mode #automationWorkflowAdd{display:none!important}.automation-focus-mode .workflow-step:not(.focused){display:none}.automation-focus-mode .workflow-step.focused>textarea,.automation-focus-mode .workflow-step.focused>.workflow-step-tools{display:none!important}.automation-focus-mode .workflow-step.focused .workflow-settings{display:block!important}.automation-focus-mode .workflow-step-remove{display:none!important}
.automation-focus-mode .automation-dialog-foot{display:flex!important}
.workflow-step.focused{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent)}
body.theme-white .workflow-step,body.theme-system-light .workflow-step{background:rgba(0,0,0,.025)}
body.theme-white .workflow-add button,body.theme-system-light .workflow-add button,body.theme-white .workflow-enhance,body.theme-system-light .workflow-enhance,body.theme-white .workflow-step-remove,body.theme-system-light .workflow-step-remove{background:#fff;color:#111}
.alarm-team-manager{display:grid;gap:7px}
.alarm-team-input-row{display:flex;gap:7px}
.alarm-team-input-row input{flex:1;min-width:0}
.alarm-team-add{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;padding:0 12px;cursor:pointer;font-size:11px;font-weight:700}
.alarm-team-chips{display:flex;gap:6px;flex-wrap:wrap}
.alarm-team-chip,.alarm-stop-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:999px;padding:6px 9px;font-size:10px}
.alarm-chip-x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;font-size:14px;line-height:1}
.alarm-stop-input{min-height:70px;resize:vertical}

.sidebar-settings-btn.settings-flash{color:var(--accent)!important;border-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 15%,var(--glass))!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 17%,transparent),0 8px 24px color-mix(in srgb,var(--accent) 20%,transparent)!important}
.security-signout-card{margin-top:4px}
.security-signout-btn{min-height:42px!important;padding:0 16px!important;border:1px solid color-mix(in srgb,#ff6b6b 42%,var(--line))!important;border-radius:13px!important;background:color-mix(in srgb,#ff6b6b 10%,var(--panel))!important;color:var(--text)!important;font-size:13px!important;font-weight:700!important;cursor:pointer}
.security-signout-btn:hover{background:color-mix(in srgb,#ff6b6b 18%,var(--panel))!important;border-color:#ff7777!important}
.call-btn.voice-listening{border-color:var(--accent)!important;background:color-mix(in srgb,var(--accent) 16%,var(--glass))!important;color:var(--accent)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 14%,transparent),0 8px 22px color-mix(in srgb,var(--accent) 13%,transparent)!important}
@media(max-width:760px){.sidebar-current-user{font-size:12px}.sidebar-foot{padding:10px!important}}
</style>

.sidebar-settings-btn.settings-flash{color:var(--text)!important;border-color:color-mix(in srgb,var(--accent) 48%,var(--line))!important;background:color-mix(in srgb,var(--accent) 10%,var(--glass))!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 10%,transparent),0 8px 20px rgba(0,0,0,.12)!important}
/* Settings navigation rows remain neutral in default, hover, pressed and selected states. */
#settingsLayer .settings-tab,#settingsLayer .settings-tab:hover,#settingsLayer .settings-tab:active,#settingsLayer .settings-tab:focus,#settingsLayer .settings-tab:focus-visible,#settingsLayer .settings-tab.active{background:transparent!important;color:var(--text)!important;border-color:var(--line)!important;box-shadow:none!important;outline-color:var(--line)!important;font-weight:550!important}
#settingsLayer .settings-tab.active .settings-row-icon,#settingsLayer .settings-tab.active .settings-row-title{color:var(--text)!important}
#settingsLayer .settings-tab:active{transform:none!important}
/* Make Sign out the same full-width, centered button treatment as the other security actions. */
#settingsLayer .security-signout-card .button-row{display:flex!important;width:100%!important;justify-content:stretch!important;align-items:stretch!important}
#settingsLayer .security-signout-btn{display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;width:100%!important;max-width:none!important;min-height:48px!important;height:48px!important;padding:0 18px!important;line-height:1.2!important;font-size:14px!important;font-weight:700!important;white-space:normal!important;box-sizing:border-box!important}
/* Circular crop editor with draggable image and zoom slider. */
.profile-crop-modal{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));background:rgba(0,0,0,.68);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.profile-crop-modal.show{display:flex}
.profile-crop-modal[hidden]{display:none!important}
.profile-crop-dialog{width:min(100%,430px);max-height:calc(100dvh - 32px);overflow:auto;padding:18px;border:1px solid var(--line);border-radius:24px;background:var(--bg);color:var(--text);box-shadow:0 24px 80px rgba(0,0,0,.38);display:flex;flex-direction:column;align-items:center;gap:13px}
.profile-crop-head{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.profile-crop-head h2{margin:0;font-size:18px;font-weight:750;line-height:1.25}
.profile-crop-head p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.4}
.profile-crop-close{width:36px;height:36px;flex:0 0 36px;border:1px solid var(--line);border-radius:50%;background:var(--glass);color:var(--text);font-size:22px;line-height:1;cursor:pointer}
.profile-crop-viewport{position:relative;width:min(76vw,280px);height:min(76vw,280px);flex:0 0 auto;border-radius:50%;overflow:hidden;background:#111;border:2px solid var(--text);box-shadow:0 0 0 7px color-mix(in srgb,var(--text) 7%,transparent);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.profile-crop-viewport:active{cursor:grabbing}
.profile-crop-viewport img{position:absolute;max-width:none!important;max-height:none!important;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
.profile-crop-help{font-size:11px;color:var(--muted);text-align:center}
.profile-crop-zoom-row{width:min(100%,330px);display:grid;grid-template-columns:38px minmax(0,1fr) 38px;align-items:center;gap:10px}
.profile-crop-zoom-row button{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--glass);color:var(--text);font-size:22px;line-height:1;cursor:pointer}
.profile-crop-zoom-row input{width:100%;accent-color:var(--text)}
.profile-crop-actions{width:100%;display:grid;grid-template-columns:1fr 1.25fr;gap:9px;margin-top:2px}
.profile-crop-actions button{min-height:46px;border-radius:14px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer}
.profile-crop-cancel{border:1px solid var(--line);background:var(--glass);color:var(--text)}
.profile-crop-use{border:1px solid var(--text);background:var(--text);color:var(--bg)}
.profile-crop-use:disabled{opacity:.55;cursor:wait}
body.profile-crop-open{overflow:hidden!important}
.chat-generation-card.atlas-flash-thinking .chat-generation-meta{display:block!important;margin-top:4px!important;color:var(--muted)!important;font-size:10px!important;font-weight:450!important;line-height:1.4!important;white-space:normal!important}
.chat-generation-card.atlas-flash-thinking .chat-generation-title{font-size:14px!important;font-weight:700!important;letter-spacing:.1px!important}
@media(max-width:760px){.sidebar-user-avatar-frame{width:32px;height:32px;flex-basis:32px}.sidebar-foot{gap:10px!important}.profile-crop-dialog{padding:16px}}
</style>

const ATLAS_APP_SHELL = "<div id=\"authScreen\">\n  <div class=\"auth-card\">\n    <div class=\"auth-logo\"><div class=\"brand-dot\"></div><div>Atlas</div></div>\n    <h1 id=\"authTitle\">Welcome back</h1>\n    <p id=\"authSubtitle\">Sign in to keep your chats, images, and videos saved.</p>\n    <div class=\"auth-form\"><input id=\"authUser\" class=\"auth-input\" autocomplete=\"username\" placeholder=\"Username\"><div class=\"password-wrap\"><input id=\"authPass\" class=\"auth-input\" type=\"password\" minlength=\"4\" autocomplete=\"current-password\" placeholder=\"Password\"><button id=\"togglePassword\" class=\"password-toggle\" type=\"button\" aria-label=\"Show password\">Show</button></div><label class=\"remember-row\"><input id=\"rememberMe\" type=\"checkbox\"><span>Remember me</span></label><button id=\"authSubmit\" class=\"auth-submit\" type=\"button\">Log in</button></div>\n    <div id=\"authError\" class=\"auth-error\"></div><button id=\"authSwitch\" class=\"auth-switch\" type=\"button\">Create a new account</button>\n    <div id=\"authHint\" style=\"font-size:11px;color:#666;margin-top:9px\">Enter your existing password to log in.</div>\n  </div>\n</div>\n<div id=\"firstProfileModal\" aria-hidden=\"true\">\n  <div id=\"firstProfileCard\">\n    <h2>Welcome to Atlas</h2>\n    <p>Tell Atlas a little about you. These details are saved to your profile settings and used as context.</p>\n    <div class=\"first-profile-grid\">\n      <label><span>Name</span><input id=\"firstProfileName\" autocomplete=\"name\" placeholder=\"Your name\"></label>\n      <label><span>Nickname</span><input id=\"firstProfileNickname\" autocomplete=\"nickname\" placeholder=\"What should Atlas call you?\"></label>\n      <label><span>Age</span><input id=\"firstProfileAge\" inputmode=\"numeric\" maxlength=\"3\" placeholder=\"Your age\"></label>\n    </div>\n    <div id=\"firstProfileError\" class=\"first-profile-error\"></div>\n    <div class=\"first-profile-actions\"><button id=\"firstPro dev-stats\" style=\"margin-top:10px\"></div>\n</div></div>\n<div class=\"dev-bar\"><button type=\"button\">Generation <span>Open</span></button><div class=\"settings-content\">\n  <input id=\"generationSearch\" class=\"settings-input generation-search\" placeholder=\"Search username or name\u2026\" autocomplete=\"off\">\n  <div id=\"generationStats\" class=\"generation-user-list\"></div>\n</div></div>\n<div class=\"dev-bar\"><button type=\"button\">Developer <span>Open</span></button><div class=\"settings-content\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><div><b>Developer mode</b><div class=\"subtle\">Developer access for the selected user.</div></div><label class=\"sw\"><input id=\"developerModeSwitch\" type=\"checkbox\"><span></span></label></div>\n  <div class=\"danger-panel\"><div class=\"settings-label\">Selected user</div><div id=\"selectedDeveloperUser\" class=\"mono\">None</div><div class=\"button-row\" style=\"margin-top:8px\"><button id=\"resetSelectedPassword\" class=\"action-btn\" type=\"button\">Reset account password</button><button id=\"deleteSelectedUser\" class=\"action-btn danger-btn\" type=\"button\">Delete account</button><button id=\"signOutSelected\" class=\"action-btn\" type=\"button\">Sign out sessions</button></div></div>\n</div></div>\n</section>\n</div>\n</div></div>\n\n<div id=\"studioLayer\" aria-hidden=\"true\"><div class=\"studio-shell\"><div class=\"studio-head\"><div><div class=\"studio-title\">Studio</div><div class=\"studio-subtitle\">Create media and speech with Atlas.</div></div><div class=\"studio-spacer\"></div><button class=\"studio-close glass-btn\" id=\"studioClose\" type=\"button\" aria-label=\"Close Studio\">\u00d7</button></div><div class=\"studio-body automation-body\"><div class=\"tts-bars\"><button class=\"studio-bar active\" id=\"studioAutomationBar\" type=\"button\"><span class=\"studio-bar-main\"><span class=\"studio-bar-title\">Automation</span><span class=\"studio- function dedupeMotionHistoryMessages(){

function framesForDuration(seconds,fps=VIDEO_DEFAULT_FPS){
  const target=Math.max(1,Math.round(Number(seconds)*Number(fps||VIDEO_DEFAULT_FPS)))+1;
  const lower=Math.floor((target-1)/8)*8+1;const upper=lower+8;

  return candidates.reduce((best,f)=>Math.abs(f-target)<Math.abs(best-target)?f:best,candidates[0]||VIDEO_FRAMES_MIN);
}

function ltxSnapFrames(value){const raw=Math.max(25,Math.min(121,Number(value)||81));return Math.max(25,Math.min(121,25+8*Math.round((raw-25)/8)))}

  try{
    if(c.action==='username_changed'&&c.username){
      currentUser=String(c.username);
      const el=$('currentUser');if(el)el.textContent='@'+currentUser+(currentRole==='developer'?' · developer':'');
      await loadChatList();
    }
    if(['settings_changed','username_changed','password_changed'].includes(c.action)) await loadSettings();
    if(['user_deleted','user_password_reset'].includes(c.action)&&currentRole==='developer') await loadDeveloperOverview();
  }catch(err){console.warn('Control UI refresh failed',err)}
}

async function pollJob(jobId,foreground=false){if(foreground)sessionStorage.setItem('atlas_active_job_id',jobId);
  if(!jobId||jobCompleted.has(jobId)||jobPollInFlight.has(jobId))return null;
  jobPollInFlight.add(jobId);
  try{
    const r=await fetch('/api/jobs/status?job_id='+encodeURIComponent(jobId),{cache:'no-store'});const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Job status failed.');
    if(d.status==='completed'){sessionStorage.removeItem('atlas_active_job_id');if(String(sessionStorage.getItem('atlas_game_job_id')||'')===String(jobId||''))sessionStorage.removeItem('atlas_game_job_id');
      jobCompleted.add(jobId);const result=d.result||{};if(currentJobId===jobId)busy(false);
      if(result.control)await applyAssistantControl(result.control);
      if(result.control?.action==='developer_read') {
        // Privileged reads are already completed server-side; never send them back through the model.
      }
      if(String(result.chat_id||'')===String(currentChatId||'')){if(setGenerationEntry(jobId,result)<0&&result.kind)history.push(newMessage('assistant',result.kind==='chat'?String(result.text||''):'',{...result,status:'completed',job_id:jobId}));renderHistory();await saveCurrentChat();await loadChatList()}
      finishChatGeneration(jobId,true);removeResumeJob(jobId);
      try{await fetch('/api/jobs/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:jobId})})}catch{}
      return d
    }
    if(d.status==='cancelled'){sessionStorage.removeItem('atlas_active_job_id');if(String(sessionStorage.getItem('atlas_game_job_id')||'')===String(jobId||''))sessionStorage.removeItem('atlas_game_job_id');
      if(currentJobId===jobId)busy(false);
      const idx=findHistoryByJob(jobId);
      if(idx>=0){
        const m=history[idx],meta=metaObject(m);meta.status='cancelled';meta.stream_text=String(d.stream_text||meta.stream_text||'');m.meta=JSON.stringify(meta);
        if(meta.kind==='chat_generation' || meta.kind==='chat')m.content=String(d.stream_text||m.content||'');
        await saveCurrentChat();
      }
      showStoppedForJob(jobId,String(d.stream_text||''));
      activeJobIds.delete(jobId);const pendingTimer=jobPollers.get(jobId);if(pendingTimer)clearTimeout(pendingTimer);jobPollers.delete(jobId);stopThinkingTicker(jobId);jobCompleted.add(jobId);if(foreground)status.textContent='';
      try{await fetch('/api/jobs/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:jobId})})}catch{}
      return d
    }
    if(d.status==='failed'){sessionStorage.removeItem('atlas_active_job_id');if(String(sessionStorage.getItem('atlas_game_job_id')||'')===String(jobId||''))sessionStorage.removeItem('atlas_game_job_id');
      if(currentJobId===jobId)busy(false);const idx=findHistoryByJob(jobId);if(idx>=0){const m=history[idx],meta=metaObject(m);m.role='assistant';m.content='';Object.assign(meta,{status:'failed',error:String(d.error||'Generation failed.'),kind:meta.kind||d.kind||'chat_generation',job_id:jobId});m.meta=JSON.stringify(meta);renderHistory();await saveCurrentChat()}
      finishChatGeneration(jobId,false);removeResumeJob(jobId);jobCompleted.add(jobId);if(foreground)status.textContent='Generation failed.';
      try{await fetch('/api/jobs/ack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:jobId})})}catch{}return d
    }
    if(d.kind==='chat'){
      const gameUi=jobUi.get(jobId);
      if(d.dig_deep||gameUi?.kind==='digdeep'){
        updateChatGeneration(jobId,d.message||'Researching',d.progress,d.status,'digdeep');
      }else{
        if(d.status==='queued'){const ui=jobUi.get(jobId);if(ui?.gameMode){stopThinkingTicker(jobId);ui.title.textContent=gamePhaseLabel(ui.gameCreatedAt);ui.card.dataset.gamePhase='thinking'}else updateChatThinkingStatus(jobId,d.message||'Queued…',d);}
        else if(d.stream_text){ updateChatStream(jobId,d.stream_text); }
        if(d.reasoning_summary && !gameUi?.gameMode)updateChatReasoning(jobId,d.reasoning_summary);
        if(!d.stream_text || gameUi?.gameMode){
          const msg=String(d.message||'Thinking…'); const ui=jobUi.get(jobId);
          if(ui?.gameMode){updateChatGeneration(jobId,msg,d.progress,d.status,'chat');ui.title.classList.remove('reading-card');}
          else if(ui?.kind==='chat')updateChatThinkingStatus(jobId,msg,d);
        }
      }
    } else if(foreground || d.kind==='presentation' || d.kind==='motion')updateChatGeneration(jobId,d.message||'Generating…',d.progress==null?null:d.progress,d.status,d.kind);
    addResumeJob(d);
    const liveCurrentChat=d.kind==='chat'&&!document.hidden&&String(d.chat_id||'')===String(currentChatId||'');const nextPollMs=foreground?(d.kind==='chat'?500:700):(liveCurrentChat?900:(document.hidden?3000:1800));jobPollers.set(jobId,setTimeout(()=>pollJob(jobId,foreground||liveCurrentChat),nextPollMs));return d
  }catch(e){if(foreground&&e.name!=='AbortError')status.textContent='Reconnecting…';jobPollers.set(jobId,setTimeout(()=>pollJob(jobId,foreground),800));return {status:'retrying',kind:(jobUi.get(jobId)?.kind||'presentation'),job_id:jobId}}
  finally{jobPollInFlight.delete(jobId)}
}

async function startMotionJobWithRetry(payload,signal){
  const waits=[350,900];let lastNetworkError=null;
  for(let attempt=0;attempt<3;attempt++){
    if(signal?.aborted)throw new DOMException('Aborted','AbortError');
    try{
      const response=await fetch('/api/motion',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal});
      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.job_id)throw new Error(data.error||`Motion request failed (HTTP ${response.status}).`);
      return data;
    }catch(error){
      if(signal?.aborted||error?.name==='AbortError')throw error;
      const isNetworkError=error instanceof TypeError&&/fetch|network|load failed/i.test(String(error.message||''));
      if(!isNetworkError)throw error;
      lastNetworkError=error;
      if(attempt>=waits.length)break;
      await new Promise(resolve=>setTimeout(resolve,waits[attempt]));
    }
  }
  throw new Error('Could not reach the Atlas Motion endpoint after 3 attempts. Check that the Atlas server is online and retry. The request ID protects against duplicate jobs if the server accepted an earlier attempt.');
}

async function downscaleDataUrl(data,maxEdge=1280,quality=.78){let src=String(data||'');try{if(src.startsWith('/media/')){const r=await fetch(src,{credentials:'same-origin',cache:'force-cache'});if(r.ok){const blob=await r.blob();src=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result||''));fr.onerror=()=>res(String(data||''));fr.readAsDataURL(blob)})}}}catch{}if(!src.startsWith('data:image/'))return src;return await new Promise(resolve=>{const img=new Image();img.onload=()=>{const w=img.naturalWidth,h=img.naturalHeight,scale=Math.min(1,maxEdge/Math.max(w,h));if(!w||!h||scale>=.999){resolve(src);return}const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=()=>resolve(src);img.src=src})}
const MODEL_CONTEXT_MAX_MESSAGES=80;
const MODEL_CONTEXT_MAX_CHARS=90000;
function trimModelContext(source){
  const clean=(Array.isArray(source)?source:[]).filter(m=>m&&['system','user','assistant'].includes(String(m.role||'').toLowerCase()));
  let kept=clean.slice(-MODEL_CONTEXT_MAX_MESSAGES);
  let chars=kept.reduce((n,m)=>n+JSON.stringify(m?.content??'').length,0);
  while(kept.length>1&&chars>MODEL_CONTEXT_MAX_CHARS){const removed=kept.shift();chars-=JSON.stringify(removed?.content??'').length}
  return kept;
}
async function prepareMessagesForModel(source){

  for(let i=0;i<normalized.length;i++){const m=normalized[i];if(isGenerationEntry(m))continue;const clone={role:m.role};const content=Array.isArray(m.content)?m.content:[{type:'text',text:String(m.content??'')}];const parts=[];
    for(const p of content){if(!p||typeof p!=='object')continue;const typ=String(p.type||'').toLowerCase();
      if(!attachmentUsers.has(i)&&['image_url','video_url','audio_url','input_audio','file'].includes(typ))continue;
      if(!attachmentUsers.has(i)&&typ==='text'){const cleaned=String(p.text||'').replace(/\n?\[Attached file:[\s\S]*?(?=\n\[Attached file:|$)/ig,'').trim();if(cleaned)parts.push({type:'text',text:cleaned});continue}

    }

function atlasModelThinkingStages(modelId,reasoning,imageMode){
  const latestUser=[...history].reverse().find(m=>m?.role==='user');
  const prompt=messageText(latestUser?.content||'').toLowerCase();
  const isMath=/\b(calculate|calculation|math|equation|solve|sum|multiply|divide|plus|minus|add|subtract)\b|\d\s*[+×*÷/]\s*\d/.test(prompt);
  const imageLabel=inferChatActivityLabel();
  const image=imageMode||imageLabel.startsWith('Viewing image');
  if(modelId==='atlas_41_flash')return [
    {title:'Syncing…',detail:'Preparing your message and conversation context'},
    {title:'Planning…',detail:'Organizing the request and the key details'},
    {title:'Writing…',detail:'Drafting a clear, useful response'},
    {title:'Revising…',detail:'Reviewing the response for clarity and consistency'},
    {title:'Finalizing…',detail:'Preparing the answer to display'}
  ];
  if(isMath)return ['Understanding the question…','Working through the calculation…','Checking the result…','Preparing a clear explanation…'];
  if(image){const viewLabel=imageLabel.startsWith('Viewing image')?imageLabel:'Viewing image…';return [viewLabel,'Understanding the visual details…','Preparing a clear response…'];}
  if(imageLabel==='Reading files…')return ['Reading the attached files…','Reviewing the relevant details…','Preparing a clear response…'];
  if(modelId==='atlas_3_ultra'&&reasoning==='none')return ['Understanding your request…','Preparing a direct answer…','Writing a clear response…'];
  if(modelId==='atlas_3_ultra'&&reasoning==='high')return ['Analyzing your request…','Working through the key details…','Checking the result…','Preparing a clear response…'];
  if(modelId==='atlas_3_ultra')return ['Understanding your request…','Analyzing the relevant details…','Checking the response…','Preparing a clear answer…'];

}
function renderAtlasFlashStage(ui,index,allowReset=false){

  const current=Number.isFinite(Number(ui.flashStageIndex))?Number(ui.flashStageIndex):0;

  if(code==="not-allowed"||code==="service-not-allowed")return "Microphone access was blocked. Allow microphone access for Atlas and try again.";
  if(code==="network")return "Speech recognition could not reach the browser speech service. Check your internet connection and try again.";
  if(code==="language-not-supported")return "English speech recognition is not available in this browser.";
  if(code==="audio-capture")return "No microphone was found. Check your device microphone.";
  return "Speech recognition stopped. Please try again.";
}
function sttStartRecognitionSession(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition)throw new Error("Live speech recognition is not supported in this browser. Please open Atlas in the latest Chrome browser.");
  const recognition=new SpeechRecognition();
  sttRecognition=recognition;
  recognition.lang="en-US";
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;
  recognition.onstart=()=>{
    if(sttRecognition!==recognition)return;
    sttStarting=false;
    sttSetMicUI(true);
    status.textContent="Listening… Your English words will appear here as you speak. Tap the mic again to stop.";
  };
  recognition.onresult=event=>{
    if(sttRecognition!==recognition)return;
    let finalText="",interimText="";
    for(let i=0;i<event.results.length;i++){
      const result=event.results[i];
      const text=String(result?.[0]?.transcript||"");
      if(result.isFinal)finalText=sttSpeechMerge(finalText,text);
      else interimText=sttSpeechMerge(interimText,text);
    }
    sttSessionTranscript=finalText;
    sttInterimTranscript=interimText;
    sttRenderTranscript();
  };
  recognition.onerror=event=>{
    const code=String(event?.error||"");
    if(code==="no-speech"&&sttKeepListening)return;
    if(code==="aborted"&&!sttKeepListening)return;
    sttLastError=sttRecognitionErrorMessage(code);
    sttKeepListening=false;
  };
  recognition.onend=()=>{
    if(sttRecognition!==recognition)return;
    if(sttSessionTranscript)sttCommittedTranscript=sttSpeechMerge(sttCommittedTranscript,sttSessionTranscript);
    sttSessionTranscript="";
    sttInterimTranscript="";
    sttRenderTranscript();
    if(sttKeepListening&&!sttLastError){
      // Some browsers end a continuous session after a pause. Restart quietly so
      // the user can keep speaking until they press the microphone again.
      sttRecognition=null;
      window.setTimeout(()=>{
        if(!sttKeepListening)return;
        try{sttStartRecognitionSession()}catch(error){sttLastError=error.message||"Could not restart speech recognition.";sttFinish(sttLastError)}
      },180);
      return;
    }
    const message=sttLastError||(sttStopRequested?"Voice input stopped.":"Voice input ended.");
    sttLastError="";
    sttStopRequested=false;
    sttFinish(message);
  };
  recognition.start();
}
let sttStopRequested=false;
function sttStopRecognition(){
  sttKeepListening=false;
  sttStopRequested=true;
  const active=sttRecognition;
  if(active){try{active.stop()}catch(error){sttFinish(error.message||"Could not stop voice input.")}}
  else sttFinish("Voice input stopped.");
}
callBtn.onclick=()=>{
  if(sttStarting)return;
  if(sttIsListening||sttKeepListening){sttStopRecognition();return;}
  sttDraftBeforeRecognition=textBox.value;
  sttCommittedTranscript="";
  sttSessionTranscript="";
  sttInterimTranscript="";
  sttLastError="";
  sttStopRequested=false;
  sttKeepListening=true;
  sttStarting=true;
  try{sttStartRecognitionSession()}
  catch(error){sttFinish(error.message||"Could not start speech recognition.")}
};

<script id="atlas-safe-mobile-plus-sheet-controller">
(()=>{
  'use strict';
  const menu=document.getElementById('modeMenu');
  const composer=document.getElementById('composer');
  const plus=document.getElementById('plusBtn');
  const sidebar=document.getElementById('sidebar');
  const overlay=document.getElementById('sidebarOverlay');
  if(!menu||!composer||!plus||menu.dataset.safeSheetControllerV2==='1')return;
  menu.dataset.safeSheetControllerV2='1';
  const mobile=()=>window.matchMedia('(max-width:767px)').matches;
  const vvHeight=()=>Math.max(320,Math.floor(window.visualViewport?.height||window.innerHeight));
  const safeTop=()=>Math.max(0,Math.floor(window.visualViewport?.offsetTop||0));
  const maxHeight=()=>Math.max(300,vvHeight()-safeTop()-2);
  const setHeight=h=>menu.style.setProperty('height',Math.round(h)+'px','important');
  const clearInline=()=>{menu.style.removeProperty('height');menu.style.removeProperty('transform');menu.style.removeProperty('transition');menu.style.removeProperty('animation');};
  const compactHeight=()=>{
    const cs=getComputedStyle(menu);
    const header=document.getElementById('mobileSheetHeader');
    const tray=document.getElementById('mobileAttachmentTray');
    const handle=getComputedStyle(menu,'::before');
    const num=v=>Number.parseFloat(v)||0;
    const handleH=num(handle.height)+num(handle.marginTop)+num(handle.marginBottom);
    const headerH=header?.getBoundingClientRect().height||44;
    const measuredTrayH=tray?.getBoundingClientRect().height||0;
    const tileH=Math.min(194,Math.max(138,Math.round(window.innerWidth*.288)));
    const trayH=Math.max(measuredTrayH,tileH);
    const padding=num(cs.paddingTop)+num(cs.paddingBottom);
    const gaps=num(cs.rowGap||cs.gap)*2;
    return Math.min(maxHeight(),Math.max(230,Math.ceil(handleH+headerH+trayH+padding+gaps+3)));
  };
  const setSidebarOpen=()=>{
    if(!sidebar)return;
    sidebar.style.transition='';sidebar.style.transform='';
    sidebar.classList.add('open');overlay?.classList.add('show');
  };
  const cleanupClosed=()=>{
    menu.classList.remove('atlas-sheet-expanded','atlas-sheet-closing');
    clearInline();
    composer.classList.remove('plus-open');
    document.body.classList.remove('atlas-mobile-plus-open','atlas-plus-sheet-open','atlas-plus-dragging');
  };
  let closeTimer=0;
  const closeSheet=(openHistory=false)=>{
    if(closeTimer){clearTimeout(closeTimer);closeTimer=0;}
    menu.style.setProperty('transition','none','important');
    menu.style.setProperty('transform','translate3d(0,105%,0)','important');
    menu.classList.remove('show','atlas-sheet-expanded','atlas-sheet-closing');
    cleanupClosed();
    if(openHistory)setSidebarOpen();
  };
  const expandSheet=()=>{
    if(!mobile()||!menu.classList.contains('show'))return;
    menu.classList.add('atlas-sheet-expanded');
    menu.style.setProperty('transition','height .32s cubic-bezier(.22,.72,.18,1),transform .32s cubic-bezier(.22,.72,.18,1)','important');
    menu.style.removeProperty('transform');
    setHeight(maxHeight());
    // If the full viewport still has spare room, content is allowed to keep its natural height.
  };
  const compactSheet=()=>{
    menu.classList.remove('atlas-sheet-expanded');
    menu.style.setProperty('transition','height .30s cubic-bezier(.22,.72,.18,1),transform .30s cubic-bezier(.22,.72,.18,1)','important');
    menu.style.removeProperty('transform');
    setHeight(compactHeight());
  };

  // Preserve Atlas's original plus-click handler; this controller only resets the sheet's visual state.
  const originalPlus=plus.onclick;
  if(typeof originalPlus==='function'){
    plus.onclick=function(event){
      const opening=!menu.classList.contains('show');
      if(opening&&mobile()){
        if(closeTimer){clearTimeout(closeTimer);closeTimer=0;}
        menu.classList.remove('atlas-sheet-expanded','atlas-sheet-closing');
        clearInline();
        // Set the final compact height while the sheet is still hidden. This removes
        // the old second resize animation that made the sheet jump after it appeared.
        setHeight(compactHeight());
      }
      return originalPlus.call(this,event);
    };
  }

  // Reflect only actual open/closed transitions. Avoid mutating the class attribute
  // repeatedly from inside its own observer (which can otherwise create an observer loop).
  let wasOpen=menu.classList.contains('show');
  new MutationObserver(()=>{
    const isOpen=menu.classList.contains('show');
    if(wasOpen&&!isOpen){
      if(closeTimer){clearTimeout(closeTimer);closeTimer=0;}
      cleanupClosed();
    }
    wasOpen=isOpen;
    document.body.classList.toggle('atlas-mobile-plus-open',mobile()&&isOpen);
    document.body.classList.toggle('atlas-plus-sheet-open',isOpen);
  }).observe(menu,{attributes:true,attributeFilter:['class']});

  let gesture=null,raf=0,pending=null,suppressClick=false;
  const cancelFrame=()=>{if(raf){cancelAnimationFrame(raf);raf=0;}pending=null;};
  const renderDrag=()=>{
    raf=0;if(!gesture||!pending)return;
    const {x,y}=pending;pending=null;
    const dx=x-gesture.startX,dy=y-gesture.startY;
    if(!gesture.axis&&Math.max(Math.abs(dx),Math.abs(dy))>9){
      if(gesture.startX<=46&&dx>9&&Math.abs(dx)>Math.abs(dy)*1.18)gesture.axis='history';
      else if(Math.abs(dy)>Math.abs(dx)*1.12)gesture.axis='vertical';
      else if(Math.abs(dx)>Math.abs(dy)*1.18)gesture.axis='horizontal';
    }
    if(gesture.axis==='history'){
      suppressClick=true;
      if(sidebar){const width=sidebar.getBoundingClientRect().width||300;sidebar.style.transition='none';sidebar.style.transform=`translateX(${Math.max(-width,Math.min(0,-width+Math.max(0,dx)))}px)`;}
      return;
    }
    if(gesture.axis==='horizontal')return;
    if(gesture.axis==='vertical'){
      suppressClick=true;menu.classList.add('atlas-sheet-dragging');
      const upAmount=gesture.startY-y;

        // animation frame. Transform-only pointer updates avoid repeated reflow on mobile.

      }else{
        if(gesture.wasExpanded){setHeight(maxHeight());}
        else{setHeight(gesture.startHeight);}
        menu.style.setProperty('transform',`translate3d(0,${Math.max(0,-upAmount)}px,0)`,'important');
      }
    }
  };
  menu.addEventListener('pointerdown',e=>{
    if(!mobile()||!menu.classList.contains('show')||e.pointerType==='mouse'&&e.button!==0||e.button!==0)return;
    if(closeTimer){clearTimeout(closeTimer);closeTimer=0;menu.classList.remove('atlas-sheet-closing');}
    gesture={id:e.pointerId,startX:e.clientX,startY:e.clientY,startHeight:menu.getBoundingClientRect().height,wasExpanded:menu.classList.contains('atlas-sheet-expanded'),axis:null,lastX:e.clientX,lastY:e.clientY};
    suppressClick=false;cancelFrame();
    try{menu.setPointerCapture(e.pointerId)}catch{}
  },{passive:true});
  menu.addEventListener('pointermove',e=>{
    if(!gesture||e.pointerId!==gesture.id)return;
    if(e.cancelable)e.preventDefault();
    pending={x:e.clientX,y:e.clientY};gesture.lastX=e.clientX;gesture.lastY=e.clientY;
    if(!raf)raf=requestAnimationFrame(renderDrag);
  },{passive:false});
  menu.addEventListener('pointerup',e=>{
    if(!gesture||e.pointerId!==gesture.id)return;
    const g=gesture;gesture=null;cancelFrame();menu.classList.remove('atlas-sheet-dragging');
    const dx=e.clientX-g.startX,dy=e.clientY-g.startY;
    // Some Android builds coalesce touchmove events until the final animation frame.
    // Classify from the release coordinates too, so a quick swipe is never lost.
    if(!g.axis&&Math.max(Math.abs(dx),Math.abs(dy))>9){
      if(g.startX<=46&&dx>9&&Math.abs(dx)>Math.abs(dy)*1.18)g.axis='history';
      else if(Math.abs(dy)>Math.abs(dx)*1.12)g.axis='vertical';
      else if(Math.abs(dx)>Math.abs(dy)*1.18)g.axis='horizontal';
    }
    if(g.axis==='history'){
      if(sidebar){sidebar.style.transition='';sidebar.style.transform='';}
      suppressClick=true;closeSheet(true);
      window.setTimeout(()=>{suppressClick=false},330);
      return;
    }
    if(g.axis==='vertical'){
      suppressClick=true;
      // Two-stage downward gesture: expanded -> compact attachments; compact -> closed.
      // This prevents the first downward pull from dismissing the menu while the user
      // is simply returning to the three upload actions.
      if(dy>48){
        if(g.wasExpanded){compactSheet();}
        else{closeSheet(false);}
      }
      else if(dy<-42){expandSheet();}
      else if(g.wasExpanded){menu.style.setProperty('transition','height .28s cubic-bezier(.22,.72,.18,1),transform .28s cubic-bezier(.22,.72,.18,1)','important');menu.style.removeProperty('transform');setHeight(maxHeight());}
      else{menu.style.setProperty('transition','height .28s cubic-bezier(.22,.72,.18,1),transform .28s cubic-bezier(.22,.72,.18,1)','important');menu.style.removeProperty('transform');setHeight(compactHeight());}
      window.setTimeout(()=>{suppressClick=false},300);
      return;
    }
    menu.style.removeProperty('transform');menu.style.removeProperty('transition');
  },{passive:true});
  menu.addEventListener('pointercancel',()=>{
    gesture=null;cancelFrame();menu.classList.remove('atlas-sheet-dragging');suppressClick=false;
    if(menu.classList.contains('atlas-sheet-expanded')){menu.style.removeProperty('transform');setHeight(maxHeight());}
    else{menu.style.removeProperty('transform');setHeight(compactHeight());}
  },{passive:true});
  menu.addEventListener('click',e=>{
    if(!suppressClick)return;
    e.preventDefault();e.stopImmediatePropagation();
  },true);
  // An edge swipe must still open the chat history drawer while the plus sheet is visible.

    if(!mobile()){menu.classList.remove('atlas-sheet-expanded');clearInline();}

      else setHeight(compactHeight());
    }
  },{passive:true});
  window.visualViewport?.addEventListener('resize',()=>{
    if(mobile()&&menu.classList.contains('show')){
      if(menu.classList.contains('atlas-sheet-expanded'))setHeight(maxHeight());
      else setHeight(compactHeight());
    }
  },{passive:true});
})();
</script>

@media(max-width:767px){

<style id="atlas-plus-sheet-model-picker-parity">
/* The creation sheet now uses the model picker's backdrop and eased entry. */
body.atlas-plus-sheet-open{overflow:hidden!important;overscroll-behavior:none!important}
body.atlas-plus-sheet-open::before,
body.atlas-mobile-plus-open.atlas-plus-sheet-open::before{
  content:""!important;display:block!important;position:fixed!important;inset:0!important;z-index:30!important;
  background:rgba(0,0,0,.16)!important;backdrop-filter:blur(5px)!important;-webkit-backdrop-filter:blur(5px)!important;
  pointer-events:none!important;
}
body.atlas-plus-sheet-open .composer-wrap{z-index:40!important;transform:none!important;filter:none!important}
body.atlas-plus-sheet-open .composer{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;filter:none!important;transform:none!important;perspective:none!important}
#modeMenu{animation:none!important;opacity:0!important;transform:translateY(10px) scale(.97)!important;transform-origin:bottom left!important;
  transition:opacity .18s ease,transform .20s cubic-bezier(.2,.8,.2,1),visibility .18s ease!important;will-change:transform,opacity!important}
#modeMenu.show{display:flex!important;opacity:1!important;visibility:visible!important;transform:translateY(0) scale(1)!important}
@media(max-width:767px){
  #modeMenu{transform:translate3d(0,105%,0)!important;opacity:0!important;will-change:transform,opacity!important;
    transition:opacity .18s ease,transform .20s cubic-bezier(.2,.8,.2,1),height .30s cubic-bezier(.2,.8,.2,1)!important;}
  #modeMenu.show{transform:translate3d(0,0,0)!important;opacity:1!important;animation:none!important}
  body.atlas-plus-dragging::before{backdrop-filter:blur(2px)!important;-webkit-backdrop-filter:blur(2px)!important}
  #modeMenu.atlas-sheet-dragging{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  #mobileAttachmentTray,#mobileAttachmentTray #menuUploadBtn,#mobileAttachmentTray #menuCameraBtn,#mobileAttachmentTray #menuFileBtn{visibility:visible!important;opacity:1!important}
  #modeMenu.atlas-sheet-dragging #mobileAttachmentTray .menu-item{animation:none!important;transition:none!important}
}
@media(prefers-reduced-motion:reduce){#modeMenu,#modeMenu.show{transition:none!important}}
</style>
<script id="atlas-plus-sheet-model-picker-parity-controller">
(()=>{
  const menu=document.getElementById('modeMenu');
  if(!menu||menu.dataset.modelPickerParity==='1')return;
  menu.dataset.modelPickerParity='1';
  const body=document.body;
  const observer=new MutationObserver(()=>{
    const open=menu.classList.contains('show');
    body.classList.toggle('atlas-plus-sheet-open',open);
    if(!open)body.classList.remove('atlas-plus-dragging');
  });
  observer.observe(menu,{attributes:true,attributeFilter:['class']});
  menu.addEventListener('pointerdown',()=>{if(menu.classList.contains('show'))body.classList.add('atlas-plus-dragging')},{passive:true});
  const end=()=>body.classList.remove('atlas-plus-dragging');
  menu.addEventListener('pointerup',end,{passive:true});
  menu.addEventListener('pointercancel',end,{passive:true});
  body.classList.toggle('atlas-plus-sheet-open',menu.classList.contains('show'));
})();
</script>
